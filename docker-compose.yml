# ============================================================
# Запуск: docker compose up --build
# Сервис поднимется на http://localhost:8000
#
# Веса моделей НЕ пекутся в образ — подключаются папкой ml/weights.
# Для GPU-инференса на Windows проще нативный запуск (см. Dockerfile).
# ============================================================
services:
  api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./ml/weights:/app/ml/weights       # скачанные/обученные веса
      - ./ml/metrics.json:/app/ml/metrics.json
      - ./examples:/app/examples           # примеры фото для вкладки «Фото»
    environment:
      # Когда веса лежат в ml/weights — переключитесь в false.
      # Пути к весам задаются в backend/app/config.py (MODEL_REGISTRY).
      - USE_MOCK=true
    restart: unless-stopped
