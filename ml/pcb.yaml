# ============================================================
# РОЛЬ: ML-участник
# Конигурация датасета для обучения YOLO (используется train_yolo.py).
#
# ЧТО СДЕЛАТЬ (TODO):
# 1. Разложите датасет DeepPCB по папкам (инструкция в ml/README.md).
# 2. ПРОВЕРЬТЕ пути ниже — они должны указывать на ваши реальные папки.
# 3. Список классов и их ПОРЯДОК должны совпадать с разметкой датасета!
#    (в YOLO-версии DeepPCB классы идут в таком порядке — сверьте
#    с файлом классов вашего скачанного датасета)
# ============================================================

path: ../ml/data/deeppcb   # корень датасета (относительно этого yaml)
train: images/train
val: images/val
test: images/test

nc: 6
names:
  0: missing_hole      # отсутствующее отверстие
  1: mouse_bite        # «мышиный укус» — дефект края дорожки
  2: open_circuit      # РАЗРЫВ ДОРОЖКИ (ключевой класс из ТЗ)
  3: short             # короткое замыкание (закоротка дорожек)
  4: spur              # заусенец
  5: spurious_copper   # лишняя медь
